 # ideas
 HYS_recently_independent:0 "Recently Independent"
 HYS_recently_independent_desc:0 "The nation of Hydrus is a new country, having just recently gained independence from the Federation of Ursa a year ago, a consequence of the weakening hold of Ursa on Hydra."
 HYS_new_army:0 "Recently Established Army"
 HYS_new_army_desc:0 "Hydrus did not have much time to create a professional army, only having militias and a handful of trained infantry."
 HYS_inexperienced_industry_idea:0 "Inexperienced Industry"
 HYS_inexperienced_industry_idea_desc:0 "Being a newly independent country, Hydrus does not have much experience within managing industrial means within the country."
 #HYS_sabotaged_factories_idea:0 "Ursan Gift"
 #HYS_sabotaged_factories_idea_desc:0 "When the Ursans left Hydrus, they had left behind infrastructure rigged with traps and explosives. Thus, many of the buildings that were built here were damaged beyond repair."
