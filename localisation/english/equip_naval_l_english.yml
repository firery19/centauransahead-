 ship_hull_cruiser_3_desc:0 "Cruisers are very flexible"
 ship_hull_cruiser_4_desc:0 "Cruisers are very flexible"
 battle_cruiser_1:0 "Battlecruiser I"
 battle_cruiser_2:0 "Battlecruiser II"
 battle_cruiser_3:0 "Battlecruiser III"
 battle_cruiser_4:0 "Battlecruiser IV"
 battle_cruiser_1_desc:0 "The post-war battlecruiser arms race resulted in several heavily armed designs, sacrificing armor for speed compared to battleships."
 battle_cruiser_2_desc:0 "Rebuilt and repurposed battlecruisers continue to outrun even modern battleship designs by lighter protection, but have developed better systems for fire control, detection and aerial defenses."
 battleship_1:0 "Battleship I"
 battleship_2:0 "Battleship II"
 battleship_3:0 "Battleship III"
 battleship_4:0 "Battleship IV"
 battleship_5:0 "Battleship V"
 battleship_6:0 "Battleship VI"
 battleship_1_desc:0 "Considered by some to be a relic of a bygone era of naval warfare, by others as the most impressive ships ever built, no one can deny that these remnants of the battleship arms race constitute some of the most heavily armed and armored vessels ever built."
 battleship_2_desc:0 "With improved stability and range, a new generation of battleships improve upon previous designs while remaining within limits stipulated by naval treaties."
 battleship_3_desc:0 "Thicker armor, stronger engines, a battery of high-caliber guns and improved anti-air capabilities can allow battleships to remain relevant, if correctly employed, in a world where naval warfare is increasingly dominated by aerial support."
 battleship_4_desc:0 "As the world sees what may be the last major battleship confrontations, the importance of heavy armaments and anti-air turrets is greater than ever."
 ship_hull_heavy_1_desc:0 "Considered by some to be a relic of a bygone era of naval warfare, by others as the most impressive ships ever built, no one can deny that these remnants of the battleship arms race constitute some of the most heavily armed and armored vessels ever built."
 ship_hull_heavy_2_desc:0 "With improved stability and range, a new generation of battleships improve upon previous designs while remaining within limits stipulated by naval treaties."
 ship_hull_heavy_3_desc:0 "Thicker armor, stronger engines, a battery of high-caliber guns and improved anti-air capabilities can allow battleships to remain relevant, if correctly employed, in a world where naval warfare is increasingly dominated by aerial support."
 ship_hull_heavy_4_desc:0 "As the world sees what may be the last major battleship confrontations, the importance of heavy armaments and anti-air turrets is greater than ever."
 carrier_1:0 "Carrier I"
 carrier_2:0 "Carrier II"
 carrier_3:0 "Carrier III"
 carrier_4:0 "Carrier IV"
 carrier_5:0 "Carrier V"
 carrier_6:0 "Carrier VI"
 carrier_1_desc:0 "The newest type of ships, they were created from converted capital ships or ocean liners in order to carry aircraft."
 carrier_2_desc:0 "As work begins on the first keel-up carrier designs, we must ensure that these ships have the range and speed to keep up with the rest of our navy, while respecting the post-war naval treaties."
 carrier_3_desc:0 "Improved construction methods and more specialized systems like deck edge elevators allow these carriers to transport more planes more efficiently."
 carrier_4_desc:0 "With many naval treaties now increasingly ignored, we can proceed to build carriers capable of transporting more planes than ever to secure air superiority cover."
 ship_hull_carrier_1_desc:0 "Many military theorists believe that naval aviation is the future. Converting old capital ships and ocean liners to carry aircraft will be the first step towards utilizing these new doctrines."
 ship_hull_carrier_2_desc:0 "As work begins on the first keel-up carrier designs, we must ensure that these ships have the range and speed to keep up with the rest of our navy, while respecting the post-war naval treaties."
 ship_hull_carrier_3_desc:0 "Improved construction methods and more specialized systems like deck edge elevators allow these carriers to transport more planes more efficiently."
 SH_battleship_1:0 "Dreadnought"
 SH_battleship_2:0 "Improved Dreadnought"
 SH_battleship_1_desc:0 "Dreadnoughts is a unique classification of ship. Much larger and heavier than battleships, dreadnoughts could be deployed to a theater of war as an almost guaranteed way to establish irrefutable dominance in that region due to their potential to decimate surface fleets with their overwhelming firepower."
 SH_battleship_2_desc:0 "With the emergence of jet engines and the new gargantuan Fleet Carriers, they challenged the dominance of Dreadnoughts, no longer invulnerable at sea. The Dreadnoughts were upfitted with a modified arsenal of rocket pods, and advanced radio equipment for quick communication with land forces."
 ship_hull_super_heavy_1_desc:0 " we can focus entirely on creating the heaviest, most well-armed battleships of all time, able to engage multiple lesser vessels."
 ship_hull_light_1:2 "1890 Destroyer Hull"
 ship_hull_light_2:2 "1900 Destroyer Hull"
 ship_hull_light_3:2 "1910 Destroyer Hull"
 ship_hull_light_4:2 "1920 Destroyer Hull"
 ship_hull_cruiser:0 "Cruiser"
 ship_hull_cruiser_desc:0 "The workhorse of the fleet, cruisers take over a lot of important duties, from scouting and screening for light cruisers to supporting the battleline for heavy cruisers."
 ship_hull_cruiser_1:1 "1890 Cruiser Hull"
 ship_hull_cruiser_2:1 "1900 Cruiser Hull"
 ship_hull_cruiser_3:0 "1910 Cruiser Hull"
 ship_hull_cruiser_4:1 "1920 Cruiser Hull"
 ship_hull_heavy:0 "Heavy Ship"
 ship_hull_heavy_desc:0 "The ultimate symbol of naval power, these massive, heavily armored behemoths command respect on the high seas."
 ship_hull_heavy_1:1 "1890 Heavy Ship Hull"
 ship_hull_heavy_2:1 "1900 Heavy Ship Hull"
 ship_hull_heavy_3:1 "1910 Heavy Ship Hull"
 ship_hull_heavy_4:1 "1920 Heavy Ship Hull"
 ship_hull_carrier:0 "Carrier"
 ship_hull_carrier_desc:0 "A new type of ship, designed primarily to carry aircraft to attack targets."
 ship_hull_carrier_0:1 "1904 Carrier Hull"
 ship_hull_carrier_conversion_bb:1 "Converted Battleship Hull"
 ship_hull_carrier_conversion_bb_desc:0 "A conversion of a battleship hull, this new type of ship was created during the Grease Wars by Ursa to carry and launch aircraft."
 ship_hull_carrier_conversion_ca:1 "Converted Cruiser Hull"
 ship_hull_carrier_conversion_ca_desc:0 "A conversion of a cruiser hull, this new type of ship was created during the Grease Wars by Ursa to carry and launch aircraft."
 ship_hull_carrier_1:1 "1930 Carrier Hull"
 ship_hull_carrier_2:1 "1945 Carrier Hull"
 ship_hull_carrier_3:1 "1954 Carrier Hull"
 ship_hull_submarine:0 "Submarine"
 ship_hull_submarine_desc:0 "Used for stealth attacks."
 ship_hull_submarine_1:1 "1955 Submarine Hull"
 ship_hull_submarine_2:1 "1960 Submarine Hull"
 ship_hull_submarine_3:1 "1966 Submarine Hull"
 ship_hull_submarine_4:1 "1970 Submarine Hull"
 ship_hull_pre_dreadnought:0 "Proto-Steelpot Hull"
 ship_hull_pre_dreadnought_desc:0 "A survivor of the time before the creation of the revolutionary steelpots, the Turret Ironclad lacks the speed and modern armaments of the modern ships, and so lack any combat value."
 ship_hull_cruiser_panzerschiff:0 "Panzerschiff"
 ship_hull_cruiser_panzerschiff_desc:0 "In an attempt to do the impossible, German engineers succeeded in mating almost-battleship-level armament with a cruiser hull. The result is a ship that outguns any other known cruiser, but which is also expensive, comparatively slow and relatively poorly armored."
 ship_hull_cruiser_coastal_defense_ship:1 "Coastal Defense Ship"
 ship_hull_cruiser_coastal_defense_ship_desc:0 "Too small for true ocean-going warfare, this relatively cheap vessel sacrifices range for heavy armament and armor."
 ship_hull_torpedo_cruiser:0 "Torpedo Cruiser"
 ship_hull_torpedo_cruiser_desc:0 "Light cruisers equipped with a large number of torpedo tubes, at the cost of a smaller main battery and fewer anti-aircraft guns."
 ship_hull_super_heavy_1:0 "Super Heavy Battleship Hull"
 ship_hull_cruiser_submarine:0 "Cruiser Submarine"
 ship_hull_cruiser_submarine_desc:0 "A larger submarine hull optimized for longer range. Can be equipped with additional fuel tanks for even more range, or a small scout airplane."
 ship_hull_midget_submarine:0 "Midget Submarine"
 ship_hull_midget_submarine_desc:0 "A small-sized submarine operated by a small crew. Its reduced range and weapon capacity is offset by a high production rate."
 ship_hull_fleet_submarine:0 "Fleet Submarine"
 ship_hull_fleet_submarine_desc:0 "Submarines that thanks to their long operational ranges can operate as surface fleet escorts and support."
 ship_hull_carrier_submarine:0 "Submarine Carrier"
 ship_hull_carrier_submarine_desc:0 "A large submarine hull that can house and launch aircraft capable of performing various air missions."
 ship_hull_nuclear_submarine:0 "Nuclear Submarine"
 ship_hull_nuclear_submarine_desc:0 "With nuclear reactors, our submarines can operate for a very long time underwater, while maintaining high speed, thus making them extremely deadly tool in our arsenal "
 ship_hull_mega_carrier:0 "Ice Carrier"
 ship_hull_mega_carrier_desc:0 "Gigantic carrier, created out of experimental ice-composites like Pykrete, that allows for regular planes to operate out of it, increasing the range of our naval aviation"
 support_ship_hull: "Support Ship"
 support_ship: "Support Ship"
 support_ship_1: "Support Ship"
 support_ship_1_desc: "Support ships are non-combat vessels focused on logistical support of the battlefleet, extending operational endurance with reserve stocks of fuel and supplies."
 support_ship_2: "Improved Support Ship"
 support_ship_2_desc: "Operational experience allows for a more advanced and capable support ship, able to sustain the battlefleet over even greater distances."
 repair_ship_hull: "Repair Ship"
 repair_ship: "Repair Ship"
 repair_ship_1: "Repair Ship"
 repair_ship_1_desc: "Repair ships carry heavy-duty recovery equipment that can mean the difference between a badly damaged ship able to limp back to port, and a sunk one."
 repair_ship_2: "Improved Repair Ship"
 repair_ship_2_desc: "An even more capable repair ship, with state of the art equipment able to save friendly warships from all but the most critical damage."
 ship_hull_escort_carrier: "Escort Carrier"
 ship_hull_escort_carrier_desc: "A smaller, cheaper aircraft carrier, typically used for convoy escort and anti-submarine warfare rather than direct fleet action. It carries a small but useful air group."
 escort_carrier: "Escort Carrier"
 escort_carrier_desc: "A smaller, cheaper aircraft carrier, typically used for convoy escort and anti-submarine warfare rather than direct fleet action. It carries a small but useful air group."
